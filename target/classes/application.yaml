spring:
  application:
    name: booking-service

  # ═══════════════════════════════════════════════════════════
  #  Connexion PostgreSQL (database per service)
  #  Port 5434 en local, voir docker-compose.yml (postgres-booking)
  #  En conteneur Docker, surchargé par SPRING_DATASOURCE_URL
  # ═══════════════════════════════════════════════════════════
  datasource:
    url: jdbc:postgresql://localhost:5434/bookingdb
    username: juribook
    password: juribook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  # ═══════════════════════════════════════════════════════════
  #  Kafka : désactivé en dev local (pas de broker disponible)
  #  En production Docker, réactiver en supprimant l'exclude
  #  et en passant SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
  # ═══════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  autoconfigure:
    exclude:
      # - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      # - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

  # ═══════════════════════════════════════════════════════════
  #  Upload de documents (Sprint 6.6)
  # ═══════════════════════════════════════════════════════════
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8083

# ═══════════════════════════════════════════════════════════
#  JWT
#  Même secret que l'auth-service, le booking-service valide
#  les tokens émis par l'auth-service, il n'en génère pas.
# ═══════════════════════════════════════════════════════════
jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256

# ═══════════════════════════════════════════════════════════
#  Stockage des documents uploadés
#  upload-dir : dossier temporaire, où arrive le fichier à l'upload.
#  permanent-storage-dir : simule un vrai stockage permanent (S3 ou
#  équivalent en production), reste local à ce stade, distinct du
#  dossier temporaire pour représenter conceptuellement le déplacement.
# ═══════════════════════════════════════════════════════════
app:
  upload-dir: ${UPLOAD_DIR:/tmp/juribook-uploads}
  permanent-storage-dir: ${PERMANENT_STORAGE_DIR:/tmp/juribook-permanent-storage}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false